<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estado de cuenta ECOVIS — REVRAM</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { padding: 24px; background: #fff; color: #111; }
    .print-header { border-bottom: 2px solid #333; margin-bottom: 16px; padding-bottom: 8px; }
    .print-header h1 { margin: 0 0 4px; font-size: 1.35rem; }
    .print-meta { font-size: 0.9rem; color: #444; margin: 8px 0 16px; }
    .equation { max-width: 420px; margin: 12px 0 20px; font-size: 0.9rem; }
    .equation div { display: flex; justify-content: space-between; gap: 12px; margin: 4px 0; }
    .equation .total { border-top: 1px solid #ccc; padding-top: 6px; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin: 12px 0; }
    th, td { border: 1px solid #ddd; padding: 5px 7px; text-align: left; }
    th { background: #f3f4f6; }
    td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    tr.cancelled td { opacity: 0.55; text-decoration: line-through; }
    tr.memo td { font-style: italic; color: #555; }
    @media print {
      .no-print { display: none !important; }
      @page { size: letter; margin: 0.5in; }
    }
  </style>
</head>
<body>
  <div class="no-print" style="margin-bottom:16px;">
    <button type="button" id="print-btn">Imprimir / Guardar PDF</button>
    <button type="button" onclick="window.close()" class="secondary">Cerrar</button>
  </div>
  <div id="root">Cargando estado de cuenta...</div>
  <script>
    const money = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' });
    function escapeHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    document.getElementById('print-btn').addEventListener('click', function() { window.print(); });

    async function load() {
      const params = new URLSearchParams(window.location.search);
      const qs = params.get('qs') || '';
      const res = await fetch('/api/ecovis/statement?' + qs, { credentials: 'include' });
      if (!res.ok) {
        document.getElementById('root').textContent = 'No autorizado o error al cargar.';
        return;
      }
      const data = await res.json();
      const header = data.header || {};
      const statement = data.statement || {};
      const eq = header.equation || {};
      const generated = new Date().toLocaleString('es-MX', { timeZone: 'America/Mexico_City' });
      const rows = statement.data || [];

      let statusLine = escapeHtml(header.label || 'Cuenta saldada');
      if (header.status !== 'settled') {
        statusLine += ': ' + money.format(header.display_amount || Math.abs(header.amount || 0)) + ' MXN';
      }

      const period = (statement.from || statement.to)
        ? (escapeHtml(statement.from || 'Inicio') + ' → ' + escapeHtml(statement.to || 'Hoy'))
        : 'Todo el historial';

      const tableRows = rows.length
        ? rows.map(function(row) {
            const cls = row.is_cancelled ? 'cancelled' : (row.informational ? 'memo' : '');
            return '<tr class="' + cls + '">'
              + '<td>' + escapeHtml(row.movement_date) + '</td>'
              + '<td>' + escapeHtml(row.concept) + '</td>'
              + '<td>' + escapeHtml(row.reference || '—') + '</td>'
              + '<td class="num">' + (row.charge ? money.format(row.charge) : '—') + '</td>'
              + '<td class="num">' + (row.credit ? money.format(row.credit) : '—') + '</td>'
              + '<td class="num">' + money.format(row.running_balance || 0) + '</td>'
              + '</tr>';
          }).join('')
        : '<tr><td colspan="6">Sin movimientos en el periodo.</td></tr>';

      document.getElementById('root').innerHTML =
        '<div class="print-header">'
        + '<h1>Estado de cuenta — Cuenta corriente ECOVIS / REVRAM</h1>'
        + '<div>' + statusLine + '</div>'
        + '</div>'
        + '<div class="print-meta">'
        + '<div>Periodo: ' + period + '</div>'
        + '<div>Saldo inicial: ' + money.format(statement.opening_balance || 0)
        + ' · Saldo final: ' + money.format(statement.closing_balance || 0) + '</div>'
        + '<div>Generado: ' + escapeHtml(generated) + '</div>'
        + '</div>'
        + '<div class="equation">'
        + '<div><span>Nos deben por proyectos</span><strong>' + money.format(eq.pending_projects || 0) + '</strong></div>'
        + '<div><span>Ajustes</span><strong>' + money.format(eq.adjustments || 0) + '</strong></div>'
        + '<div><span>Les debemos por prestamos</span><strong>' + money.format(eq.outstanding_loans || 0) + '</strong></div>'
        + '<div class="total"><span>Saldo neto</span><strong>' + money.format(eq.net_balance || 0)
        + (header.favor_of ? ' a favor de ' + escapeHtml(header.favor_of) : '')
        + '</strong></div>'
        + '</div>'
        + '<table><thead><tr>'
        + '<th>Fecha</th><th>Concepto</th><th>Referencia</th>'
        + '<th>Cargo</th><th>Abono</th><th>Saldo corrido</th>'
        + '</tr></thead><tbody>' + tableRows + '</tbody></table>';
    }
    load();
  </script>
</body>
</html>
