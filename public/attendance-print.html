<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lista de Asistencia</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; font-size: 10px; padding: 10px; }
    .header { text-align: center; margin-bottom: 12px; }
    .header h1 { font-size: 16px; margin-bottom: 2px; }
    .header h2 { font-size: 13px; font-weight: normal; margin-bottom: 2px; }
    .header h3 { font-size: 11px; font-weight: normal; }
    table { width: 100%; border-collapse: collapse; font-size: 9px; }
    th, td { border: 1px solid #333; padding: 3px 4px; text-align: center; vertical-align: top; }
    th { background: #f0f0f0; font-weight: bold; }
    td.name-cell { text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
    td.position-cell { text-align: left; font-size: 8px; max-width: 90px; overflow: hidden; text-overflow: ellipsis; }
    td.wrap-cell {
      text-align: left;
      font-size: 8px;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      max-width: 160px;
    }
    td.extra-cell { text-align: right; font-size: 8px; white-space: nowrap; }
    .day-header { font-size: 8px; }
    .day-date { font-size: 7px; color: #555; }
    .status-F { background-color: #fff9c4; }
    .status-B { background-color: #e0e0e0; }
    .status-Astar { background-color: #b3e5fc; color: #0d47a1; font-weight: 700; border-color: #0d47a1; }
    .status-PC { background-color: #ffcdd2; }
    .status-PS { background-color: #ef9a9a; }
    .status-D { background-color: #bbdefb; }
    .status-I { background-color: #c8e6c9; }
    .status-V { background-color: #b2dfdb; }
    .signatures { margin-top: 30px; display: flex; justify-content: space-around; }
    .signature-box { text-align: center; width: 200px; }
    .signature-line { border-top: 1px solid #333; margin-top: 40px; padding-top: 4px; font-size: 9px; }
    .legend { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; font-size: 8px; }
    .legend span { padding: 2px 5px; border: 1px solid #999; border-radius: 2px; }
    .summary { margin-top: 10px; font-size: 9px; }
    .no-print { margin-bottom: 12px; }
    .status-banner { margin-bottom: 12px; font-size: 12px; color: #333; }
    .status-banner.error { color: #b00020; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    @media print {
      .no-print { display: none; }
      body { padding: 5mm; }
      @page { size: letter landscape; margin: 8mm; }
      th, td, .legend span {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .status-F { background-color: #fff9c4 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .status-B { background-color: #e0e0e0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .status-Astar { background-color: #b3e5fc !important; color: #0d47a1 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .status-PC { background-color: #ffcdd2 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .status-PS { background-color: #ef9a9a !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .status-D { background-color: #bbdefb !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .status-I { background-color: #c8e6c9 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .status-V { background-color: #b2dfdb !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="no-print">
    <button id="print-btn" type="button" disabled>Imprimir / Guardar PDF</button>
    <button type="button" onclick="window.close()">Cerrar</button>
  </div>
  <p id="status-banner" class="status-banner no-print">Cargando lista de asistencia…</p>

  <div id="print-root" hidden>
    <div class="header">
      <h1>REVRAM</h1>
      <h2>LISTA DE ASISTENCIA</h2>
      <h3 id="week-title"></h3>
    </div>

    <table>
      <thead id="table-head"></thead>
      <tbody id="table-body"></tbody>
    </table>

    <div class="summary" id="summary-section"></div>

    <div class="signatures">
      <div class="signature-box">
        <div class="signature-line">Firma de Autorización</div>
      </div>
      <div class="signature-box">
        <div class="signature-line">Firma de Contabilidad</div>
      </div>
      <div class="signature-box">
        <div class="signature-line">Firma de Recursos Humanos</div>
      </div>
    </div>

    <div class="legend">
      <span class="status-F">F Falta</span>
      <span class="status-B">B Baja</span>
      <span>A Asistencia</span>
      <span class="status-Astar">A* Personal fuera de taller / Trabajo fuera</span>
      <span class="status-PC">PC Permiso c/goce de sueldo</span>
      <span class="status-PS">PS Permiso s/goce de sueldo</span>
      <span class="status-D">D Descanso</span>
      <span class="status-I">I Incapacidad</span>
      <span class="status-V">V Vacaciones</span>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const weekId = params.get('id');
    const printBtn = document.getElementById('print-btn');
    const statusBanner = document.getElementById('status-banner');
    const printRoot = document.getElementById('print-root');
    let printReady = false;
    let printTriggered = false;

    function setStatus(message, isError) {
      if (!statusBanner) return;
      statusBanner.textContent = message || '';
      statusBanner.classList.toggle('error', !!isError);
      statusBanner.hidden = !message;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function waitForPaint() {
      return new Promise((resolve) => {
        requestAnimationFrame(() => {
          requestAnimationFrame(resolve);
        });
      });
    }

    async function waitUntilPrintReady() {
      if (document.fonts && document.fonts.ready) {
        try {
          await document.fonts.ready;
        } catch (_err) {
          /* ignore font readiness errors */
        }
      }
      await waitForPaint();
      // Force layout so print preview sees the rendered table (not a blank frame).
      void printRoot.offsetHeight;
      await waitForPaint();
    }

    async function triggerPrintWhenReady() {
      if (!printReady || printTriggered) return;
      printTriggered = true;
      await waitUntilPrintReady();
      window.print();
    }

    if (printBtn) {
      printBtn.addEventListener('click', () => {
        if (!printReady) {
          setStatus('Espere a que termine de cargarse la lista antes de imprimir.', true);
          return;
        }
        window.print();
      });
    }

    if (!weekId) {
      setStatus('Error: No se especificó ID de nómina.', true);
    } else {
      fetch(`/api/attendance/weeks/${weekId}/print`, { credentials: 'include' })
        .then((r) => { if (!r.ok) throw new Error('Sin acceso'); return r.json(); })
        .then(async (week) => {
          render(week);
          printRoot.hidden = false;
          printReady = true;
          if (printBtn) printBtn.disabled = false;
          setStatus('Lista lista para imprimir.');
          await triggerPrintWhenReady();
        })
        .catch((e) => {
          printReady = false;
          if (printBtn) printBtn.disabled = true;
          setStatus(`Error: ${e.message}`, true);
        });
    }

    function formatExtra(amount) {
      if (amount == null || amount === '') return '';
      const num = Number(amount);
      if (!Number.isFinite(num) || num === 0) return amount === 0 || amount === '0' ? '$0.00' : '';
      return '$' + num.toLocaleString('es-MX', { minimumFractionDigits: 2 });
    }

    function render(week) {
      const titleEl = document.getElementById('week-title');
      const startParts = week.week_start_date.split('-');
      const endParts = week.week_end_date.split('-');
      titleEl.textContent = `NOMINA SEMANA #${week.week_number} - ${startParts[2]}/${startParts[1]}/${startParts[0]} AL ${endParts[2]}/${endParts[1]}/${endParts[0]}`;

      const startDate = new Date(week.week_start_date + 'T00:00:00Z');
      const dayNames = ['LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO', 'DOMINGO'];
      const months = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
      const dayDates = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(startDate);
        d.setUTCDate(d.getUTCDate() + i);
        dayDates.push(`${d.getUTCDate()}-${months[d.getUTCMonth()]}-${String(d.getUTCFullYear()).slice(2)}`);
      }

      const thead = document.getElementById('table-head');
      thead.innerHTML = `<tr>
        <th>Num</th>
        <th>Nombre del trabajador</th>
        <th>Puesto</th>
        ${dayNames.map((d, i) => `<th><div class="day-header">${d}</div><div class="day-date">${dayDates[i]}</div></th>`).join('')}
        <th>Lugar de trabajo</th>
        <th>Extras</th>
        <th>Observaciones</th>
      </tr>`;

      const tbody = document.getElementById('table-body');
      const dayFields = ['monday_status', 'tuesday_status', 'wednesday_status', 'thursday_status', 'friday_status', 'saturday_status', 'sunday_status'];

      const statusClassMap = { 'A*': 'status-Astar', F: 'status-F', B: 'status-B', PC: 'status-PC', PS: 'status-PS', D: 'status-D', I: 'status-I', V: 'status-V' };

      tbody.innerHTML = (week.employees || []).map((emp) => {
        const dayCells = dayFields.map((f) => {
          const val = emp[f] || 'A';
          const cls = statusClassMap[val] ? ` class="${statusClassMap[val]}"` : '';
          return `<td${cls}>${escapeHtml(val)}</td>`;
        }).join('');

        const location = emp.project_location_text || '';
        const extras = formatExtra(emp.extra_payment_amount);
        const observations = emp.notes || '';

        return `<tr>
          <td>${escapeHtml(emp.employee_number_snapshot)}</td>
          <td class="name-cell">${escapeHtml(emp.full_name_snapshot)}</td>
          <td class="position-cell">${escapeHtml(emp.position_snapshot || '')}</td>
          ${dayCells}
          <td class="wrap-cell">${escapeHtml(location)}</td>
          <td class="extra-cell">${escapeHtml(extras)}</td>
          <td class="wrap-cell">${escapeHtml(observations)}</td>
        </tr>`;
      }).join('');

      if (week.summary) {
        const s = week.summary;
        const summaryEl = document.getElementById('summary-section');
        const dayLabels = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
        const dayKeys = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
        const absLines = dayKeys.map((k, i) => s.absencesByDay[k] > 0 ? `${dayLabels[i]}: ${s.absencesByDay[k]}` : '').filter(Boolean);
        summaryEl.innerHTML = `<strong>Resumen:</strong> ${s.totalEmployees} empleados | Inasistencias: ${s.totalAbsences} ${absLines.length ? '(' + absLines.join(', ') + ')' : ''} | Pagos extra: $${Number(s.totalExtraPayments || 0).toLocaleString('es-MX', { minimumFractionDigits: 2 })}`;
      }
    }
  </script>
</body>
</html>
